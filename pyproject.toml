[project]
name = "interact360"
version = "0.1.0"
description = "360° video interaction detection and tracking"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "hydra-core==1.3.2",
    "imageio==2.37.0",
    "iopath==0.1.10",
    "matplotlib==3.10.3",
    "millify==0.1.1",
    "numpy==2.1.2",
    "opencv-python==4.11.0.86",
    "pillow==11.0.0",
    "print-color==0.4.6",
    "tqdm==4.67.1",
    "ultralytics==8.3.133",
    "transformers",
    "json_tricks",
]

[project.optional-dependencies]
gui = [
    "PyQt6",
    "pyqtgraph",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sam2", "sapiens_liter", "misc", "process", "export"]

